---
- name: reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart node_exporter
  become: true
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

- name: restart otelcol
  become: true
  ansible.builtin.systemd:
    name: otelcol-contrib
    state: restarted
    daemon_reload: true
