---
# ---------------------------------------------------------------- disabled --

- name: Tear down AnythingLLM
  when: not allm_enabled
  become: true
  block:
    - name: Stop and disable the AnythingLLM service
      ansible.builtin.systemd:
        name: "{{ allm_service_name }}"
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove any lingering AnythingLLM container
      ansible.builtin.command:
        cmd: docker rm -f {{ allm_container_name }}
      register: _allm_rm
      changed_when: _allm_rm.rc == 0
      failed_when: false

    - name: Remove the AnythingLLM unit file
      ansible.builtin.file:
        path: /etc/systemd/system/{{ allm_service_name }}.service
        state: absent
      notify: reload systemd for anythingllm

# ----------------------------------------------------------------- enabled --

- name: Deploy AnythingLLM
  when: allm_enabled
  block:
    - name: Fail if no model is configured for the LLM provider
      ansible.builtin.assert:
        that: allm_llm_model | length > 0
        fail_msg: >-
          allm_llm_model is empty. Set it to the vLLM --served-model-name
          (ms_served_name) so AnythingLLM asks for a model that exists.
      when: allm_llm_provider | length > 0

    - name: Ensure AnythingLLM directories exist
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ allm_base_dir }}", owner: root, group: root, mode: "0755" }
        # Written by the container's unprivileged user, so it must be owned by
        # that uid/gid rather than by root or by claude.
        - { path: "{{ allm_storage_dir }}", owner: "{{ allm_uid }}",
            group: "{{ allm_gid }}", mode: "0750" }

    # Generated once and kept. Regenerating it on every run would invalidate
    # every existing session and API key.
    - name: Generate the JWT secret once
      become: true
      ansible.builtin.shell:
        cmd: openssl rand -hex 32 > {{ allm_base_dir }}/jwt_secret
        creates: "{{ allm_base_dir }}/jwt_secret"

    - name: Lock down the JWT secret
      become: true
      ansible.builtin.file:
        path: "{{ allm_base_dir }}/jwt_secret"
        owner: root
        group: root
        mode: "0600"

    - name: Read the JWT secret
      become: true
      ansible.builtin.slurp:
        src: "{{ allm_base_dir }}/jwt_secret"
      register: _allm_jwt_raw

    - name: Expose the JWT secret to the template
      ansible.builtin.set_fact:
        _allm_jwt: "{{ _allm_jwt_raw.content | b64decode | trim }}"
      no_log: true

    - name: Pull the AnythingLLM image
      ansible.builtin.command:
        cmd: docker pull {{ allm_image }}
      register: _allm_pull
      changed_when: >-
        'Downloaded newer image' in _allm_pull.stdout
        or 'Pulling from' in _allm_pull.stdout
      async: 1800
      poll: 15

    - name: Write the AnythingLLM environment file
      become: true
      ansible.builtin.template:
        src: anythingllm.env.j2
        dest: "{{ allm_base_dir }}/anythingllm.env"
        owner: root
        group: root
        mode: "0600"
      register: _allm_env
      no_log: true

    - name: Install the AnythingLLM systemd unit
      become: true
      ansible.builtin.template:
        src: anythingllm.service.j2
        dest: /etc/systemd/system/{{ allm_service_name }}.service
        owner: root
        group: root
        mode: "0644"
      register: _allm_unit
      notify: reload systemd for anythingllm

    - name: Apply unit changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable and start AnythingLLM
      become: true
      ansible.builtin.systemd:
        name: "{{ allm_service_name }}"
        enabled: true
        state: >-
          {{ 'restarted'
             if (_allm_unit.changed or _allm_env.changed)
             else 'started' }}

    - name: Wait for AnythingLLM to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ allm_port }}/api/ping"
        status_code: [200, 404]
      register: _allm_health
      until: _allm_health.status in [200, 404]
      retries: "{{ (allm_health_timeout | int / 10) | int }}"
      delay: 10
      when: allm_wait_for_health

    - name: Report
      ansible.builtin.debug:
        msg: >-
          AnythingLLM on {{ inventory_hostname }} at
          http://{{ ansible_host | default(inventory_hostname) }}:{{ allm_port }}
          talking to {{ allm_llm_base_path }} as "{{ allm_llm_model }}"
      when: allm_wait_for_health
