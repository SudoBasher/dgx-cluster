---
# Open WebUI front end. Off by default; enable per node in host_vars.
# Talks to the vLLM on the same host through host.docker.internal.

## On/off
# Set false to stop the service, disable it and remove the unit. The data
# directory (accounts, chats, uploaded documents) is left in place.
owui_enabled: false

## Image
# Pinned to a release tag. Upstream's :main and :latest follow the main branch,
# not the newest stable release. v0.13.0 is published for linux/arm64.
owui_image: ghcr.io/open-webui/open-webui:v0.13.0
owui_port: 3001                    # host port; the container listens on 8080
owui_service_name: openwebui
owui_container_name: openwebui

## Host paths
# The container runs as root and writes the SQLite database, uploads and the
# embedding cache under /app/backend/data, mounted from owui_data_dir.
owui_base_dir: /opt/openwebui
owui_data_dir: /opt/openwebui/data

## Branding and default model
owui_name: ""                      # WEBUI_NAME; shown as "<name> (Open WebUI)"
owui_default_model: ""             # must match the vLLM --served-model-name

## LLM connection
# host.docker.internal is mapped to the host gateway in the unit, so this
# reaches vLLM without hardcoding an IP.
owui_llm_base_url: "http://host.docker.internal:8000/v1"

# Picks the "openwebui" entry out of ms_api_keys so the front end has its own
# revocable credential. Falls back to a placeholder if no keys are configured.
owui_llm_api_key: >-
  {{ (ms_api_keys | default([]) | selectattr('name','equalto','openwebui')
      | map(attribute='key') | list | first) | default('not-required', true) }}

## Persistence of admin settings
# Open WebUI stores the connection settings above (and sign-up, default models
# and most admin settings) in its database. The environment seeds them on the
# first launch only; after that the database wins. The exception is the LLM
# URL, key and default model: the role copies those three from the env into
# the database after every start (files/sync_connection.py), so they follow
# Ansible. Setting this false makes the environment win for every setting, at
# the cost of admin-UI changes being lost on restart.
owui_persistent_config: true

## Network allowlist (DOCKER-USER), same roles/port_allowlist as vLLM's
# Until 2026-11-11 the port was open to the lab LAN and, through docker-proxy
# on [::], over IPv6, so the admin password was the only guard. Now the same
# networks as vLLM and Bifrost: loopback, Docker bridges, the VPN overlay.
# IPv4 only: the unit publishes on 0.0.0.0, and the play fails if the port
# ever listens on IPv6. The rule matches container port 8080; no other
# container here listens on it (Bifrost's image exposes 8080 but serves 4000).
owui_restrict_network: true
owui_allowed_cidrs:
  - 127.0.0.0/8
  - 172.16.0.0/12          # Docker bridge networks
  - 100.64.0.0/10          # NetBird overlay

## Anything else, as KEY: value
owui_extra_env: {}

## Health check after (re)start
owui_wait_for_health: true
owui_health_timeout: 600
