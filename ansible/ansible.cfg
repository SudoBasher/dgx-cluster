[defaults]
inventory          = inventory.yml
roles_path         = roles
host_key_checking  = False
interpreter_python = /usr/bin/python3
# community.general.yaml was removed in v12; this is the built-in replacement.
result_format      = yaml
display_skipped_hosts = False
retry_files_enabled = False

[ssh_connection]
# Reuse the repo-local SSH config so host aliases, the repo key and
# known_hosts all resolve exactly as they do for a manual ssh.
ssh_args = -F ../.ssh/config -o ControlMaster=auto -o ControlPersist=120s
pipelining = True
