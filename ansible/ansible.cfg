[defaults]
inventory          = inventory.yml
roles_path         = roles
host_key_checking  = False
interpreter_python = /usr/bin/python3
# community.general.yaml was removed in v12; this is the built-in replacement.
result_format      = yaml
display_skipped_hosts = False
retry_files_enabled = False
# Referenced by templates and copy blocks across the roles; not set by default.
ansible_managed = Ansible managed - local edits will be overwritten
# One fixed file, appended across runs, so a long play's progress can be
# tailed (`tail -f ../logs/ansible.log`) without hunting for a new filename
# each time. gitignored; rotate or truncate it by hand if it grows large.
log_path = ../logs/ansible.log

[ssh_connection]
# Reuse the repo-local SSH config so host aliases, the repo key and
# known_hosts all resolve exactly as they do for a manual ssh.
ssh_args = -F ../.ssh/config -o ControlMaster=auto -o ControlPersist=120s
pipelining = True
