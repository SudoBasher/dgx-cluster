---
# spark1 (spark-a01a) — Qwen3.6-35B-A3B, NVFP4
#
# The serving node. A mixture-of-experts model with ~3B parameters active per
# token. Decode on GB10 is bound by memory bandwidth (~273 GB/s), so reading
# ~3B 4-bit weights per token instead of a dense model's ~28 GB is what buys
# the speed: ~79 tok/s here, against 8.4 for the Qwen3.8-27B this node ran
# until 2026-11-08.
#
# Copied from host_vars/spark2.yml on 2026-11-08, when spark1 took over from
# spark2 ahead of spark2 being wiped. Everything below matches spark2 except
# the weight source, the UI name and the comments that say which node.
#
# To free the node instead, set ms_enabled: false; that stops the service,
# disables it and removes the unit, leaving the weight cache.

## Model
ms_enabled: true
ms_model_repo: nvidia/Qwen3.6-35B-A3B-NVFP4
ms_served_name: qwen3.6-35b-a3b
ms_max_model_len: 262144
ms_reasoning_parser: qwen3

## Image
# Pinned rather than :latest, so an upstream release never changes this node
# unannounced. 0.33.0 since 2026-11-07, for presence_penalty: 0.28.0 dropped
# it from --override-generation-config (see Serving flags). The vLLM recipe
# measured on 0.28.0, and NVFP4 needs at least 0.28.0 for FlashInfer's XQA
# decode kernel on SM12x. Every flag below was checked against
# `vllm serve --help=all` in this image before the switch. Rolling back is
# this line to v0.28.0, which is still on disk.
ms_image: vllm/vllm-openai:v0.33.0

## Memory
# The vLLM GB10 recipe caps this at 0.5 because the pool is shared with the
# host. ~60 GiB covers ~20 GB of weights plus the KV cache at full context.
ms_gpu_memory_utilization: 0.5

## Tool calling
# Agent front ends send tool_choice="auto", which vLLM rejects with a 400
# unless both of these are set. qwen3_xml and the recipe's qwen3_coder are
# aliases for the same parser.
ms_enable_auto_tool_choice: true
ms_tool_call_parser: qwen3_xml

## Serving flags
# From https://recipes.vllm.ai/Qwen/Qwen3.6-35B-A3B, GB10 + NVFP4 profile.
# marlin runs the NVFP4 MoE layers; the FP8 Triton MoE path that lacks a tuned
# config on SM12x is not used. fastsafetensors loads weights straight to GPU.
ms_extra_args:
  - --kv-cache-dtype fp8
  - --attention-backend flashinfer
  - --moe-backend marlin
  - --max-num-seqs 8
  - --max-num-batched-tokens 8192
  - --enable-chunked-prefill
  - --async-scheduling
  # Prefix caching OFF since 2026-11-08, explicitly rather than by omission so
  # no default can turn it back on. The recipe calls it experimental for this
  # hybrid (GDN linear attention + attention) model, and the 2026-11-08 engine
  # crash was a prefix-cache hit (RUNBOOK.md section 20, known issue). Costs a
  # re-prefill of shared prompts, ~1 s per 6k tokens.
  - --no-enable-prefix-caching
  - --load-format fastsafetensors
  # Qwen's thinking-mode recommendation, applied as a server default because
  # AnythingLLM sends only temperature. Curbs the endless repetition a long
  # output cap would otherwise let run. A request that sets presence_penalty
  # itself still wins.
  #
  # Needs vLLM 0.33 or later. 0.28.0's get_diff_sampling_param copied only
  # repetition_penalty, temperature, top_k, top_p, min_p and max_new_tokens
  # out of the merged config and dropped presence_penalty without a warning.
  #
  # max_new_tokens is the output cap for any request that doesn't send
  # max_tokens; vLLM renames it to max_tokens. Open WebUI sends none by
  # default, so without this a reply could run to the full 262144-token
  # window. 81920 is Qwen's figure for "highly complex problems".
  #
  # The outer single quotes are for systemd, which unquotes ExecStart words
  # and would otherwise strip the JSON's double quotes even mid-word, leaving
  # vLLM {presence_penalty:1.5} and a crash loop (2026-11-06, 19 restarts).
  - "'--override-generation-config={\"presence_penalty\":1.5,\"max_new_tokens\":81920}'"

## Weights
# Copied from spark2 over the 200GbE interconnect rather than downloaded again
# from Hugging Face. Falls back to a normal download if spark2 doesn't have it,
# which is what happens once spark2 is wiped. The Qwen3.8-27B cache stays in
# /opt/dgx-models, so going back is a host_vars revert and no download.
ms_weights_peer: spark2-ic

## Front end: Open WebUI
# Replaced AnythingLLM on 2026-11-08 (spark2 switched on 2026-11-07).
# allm_enabled: false makes the anythingllm role tear down its unit and
# container; its data stays in /opt/anythingllm. Open WebUI takes over port
# 3001, so the URL is unchanged.
allm_enabled: false

# Authenticates to vLLM with the "openwebui" entry from .secrets/vllm-keys.yml,
# which the role picks up on its own. The first account created in the UI
# becomes the admin.
owui_enabled: true
owui_name: spark1

# Through Bifrost rather than straight to vLLM (since 2026-11-08), so chats in
# the UI are counted per client alongside opencode and anything else on the
# gateway. Model ids carry Bifrost's provider prefix. Uses its own virtual key,
# spark1-openwebui, from .secrets/bifrost.yml.
# Over HTTPS since 2026-11-10, through the same nginx as every other client.
# The container resolves the public name to spark1's VPN address and
# connects from the Docker bridge, which the nginx allowlist admits.
owui_llm_base_url: "https://bifrost.isc-spectro-sbx.click/v1"
owui_llm_api_key: >-
  {{ bifrost_virtual_keys | selectattr('id', 'equalto', 'vk-spark1-openwebui')
     | map(attribute='value') | first }}
owui_default_model: vllm/qwen3.6-35b-a3b

# Tag each request with who sent it. Bifrost copies any x-bf-lh-<name> header
# into the log entry's metadata as <name>, with no gateway config. Email is
# left on its default header name, which Bifrost does not record.
owui_extra_env:
  ENABLE_FORWARD_USER_INFO_HEADERS: "True"
  FORWARD_USER_INFO_HEADER_USER_NAME: x-bf-lh-owui-user
  FORWARD_USER_INFO_HEADER_USER_ID: x-bf-lh-owui-user-id
  FORWARD_USER_INFO_HEADER_USER_ROLE: x-bf-lh-owui-role
  FORWARD_SESSION_INFO_HEADER_CHAT_ID: x-bf-lh-owui-chat-id

## Gateway: Bifrost
# One OpenAI-compatible endpoint for opencode and other clients, with a virtual
# key per client so usage can be told apart in metrics and logs. Clients use
#   base URL  https://bifrost.isc-spectro-sbx.click/v1   (over the VPN)
#   model     vllm/qwen3.6-35b-a3b
#   key       a bifrost_virtual_keys value from .secrets/bifrost.yml
bifrost_enabled: true
bifrost_vllm_model: qwen3.6-35b-a3b

# Headers opencode 2.2.6 sends with every model request (captured 2026-11-09).
# x-opencode-client is "cli" from both the terminal and the desktop app (the
# shared background server sets it); the session and project ids group
# requests; traceparent and b3 join logs to OTel traces.
bifrost_logging_headers:
  - x-opencode-client
  - x-opencode-session
  - x-opencode-session-id
  - x-session-id
  - x-session-affinity
  - x-opencode-project
  - traceparent
  - b3

## HTTPS for Bifrost and Open WebUI
# Public DNS names for spark1's VPN address (terraform/bifrost.tf), with nginx
# and a Let's Encrypt certificate each, in front of the local ports
# (roles/tls_proxy). Open WebUI joined on 2026-11-11. Switched on once the
# Route53 key is in .secrets/acme-route53.yml, so a run without it still
# deploys everything else.
_tls_ready: "{{ acme_aws_access_key_id | default('') | length > 0 }}"
_bifrost_fqdn: bifrost.isc-spectro-sbx.click
tlsp_enabled: "{{ _tls_ready }}"
tlsp_sites:
  - fqdn: "{{ _bifrost_fqdn }}"
    upstream: "http://127.0.0.1:{{ bifrost_port | default(4000) }}"
  - fqdn: openwebui.isc-spectro-sbx.click
    upstream: "http://127.0.0.1:{{ owui_port | default(3001) }}"
bifrost_external_url: "{{ 'https://' ~ _bifrost_fqdn if _tls_ready else '' }}"

# Port 3001 on loopback too, so https://openwebui.isc-spectro-sbx.click is the
# only way in; http://spark1:3001 stops answering.
owui_publish_address: "{{ '127.0.0.1' if _tls_ready else '0.0.0.0' }}"

# With HTTPS up, port 4000 is published on loopback only (since 2026-11-11):
# nginx and the telemetry scraper are its only callers, so a client left on
# http://100.123.96.149:4000 fails instead of quietly skipping HTTPS. Dropping
# the VPN range from bifrost_allowed_cidrs would not do it: NetBird accepts
# everything from wt0 in FORWARD before Docker's DOCKER-USER chain is reached.
bifrost_publish_address: "{{ '127.0.0.1' if _tls_ready else '0.0.0.0' }}"

## MCP: Gmail through Bifrost
# Bifrost logs each person into Google (per_user_oauth) and keeps their token
# under their own virtual key; the Workspace MCP server (roles/workspace_mcp)
# calls Gmail with whichever token a request carries. Read-only. Switched on
# once the Google OAuth client is in .secrets/google-oauth.yml.
_google_ready: "{{ google_oauth_client_id | default('') | length > 0 }}"
wmcp_enabled: "{{ _google_ready }}"
wmcp_tools: gmail
wmcp_read_only: true
bifrost_docker_network: "{{ 'mcp' if _google_ready else '' }}"

# One Bifrost connection per Google account kind a person may log in with;
# a second (gmail_work) would be another entry with the same server URL.
# The scopes are exactly what the server requires in read-only Gmail mode.
# access_type=offline gets a refresh token, prompt=consent makes Google issue
# a new one even to someone who already granted access.
_gmail_mcp_clients:
  - name: gmail_personal
    connection_type: http
    connection_string: "http://{{ wmcp_container_name | default('workspace-mcp') }}:{{ wmcp_port | default(8000) }}/mcp"
    auth_type: per_user_oauth
    oauth_config:
      client_id: env.BIFROST_GOOGLE_CLIENT_ID
      client_secret: env.BIFROST_GOOGLE_CLIENT_SECRET
      authorize_url: "https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent"
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - openid
        - https://www.googleapis.com/auth/userinfo.email
        - https://www.googleapis.com/auth/userinfo.profile
        - https://www.googleapis.com/auth/gmail.readonly
    tools_to_execute: ["*"]
bifrost_mcp_clients: "{{ _gmail_mcp_clients if _google_ready else [] }}"

# Deny by default: only these keys see the Gmail tools. vk-sudobasher is a
# person, not a client; every client that person uses sends it for MCP.
bifrost_vk_mcp_grants:
  vk-sudobasher:
    - mcp_client_name: gmail_personal
      tools_to_execute: ["*"]

# Scraped by the telemetry agent alongside vLLM; roles/telemetry_agent.
tel_extra_scrape_jobs:
  - name: bifrost
    targets: ["127.0.0.1:4000"]
    interval: 5s

## VPN
nbc_setup_key: "{{ nbc_key_spark }}"   # spark-node -> sparks
nbc_routes:
  - "10.255.128.0/20"     # lab VLAN, for hosts that cannot run a client
